<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹊山精煤网站 — 穆宏伟</title>
<style>
  @font-face {
    font-family: 'TitleFont';
    src: url('/fonts/title.ttf') format('truetype');
    font-weight: 700 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #101725;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 48px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 700;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #101725;
  }
  .nav-links {
    display: flex;
    gap: 32px;
  }
  .nav-links a {
    color: #666;
    text-decoration: none;
    font-size: 13px;
  }
  .nav-links a:hover { color: #5A73D8; }
  .gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding-top: 80px;
    display: flex;
    flex-direction: column;
  }
  .gallery img {
    width: 100%;
    display: block;
  }

  .burger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; }
  .burger span { width: 22px; height: 2px; background: currentColor; border-radius: 2px; transition: all .3s; }
  @media (max-width: 760px) {
    nav { padding: 14px 18px !important; }
    nav .nav-links { display: none; position: fixed; top: 56px; left: 0; right: 0; flex-direction: column; gap: 0; background: rgba(10,14,24,0.97); padding: 12px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    nav .nav-links.open { display: flex; }
    .nav-links a { padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .burger { display: flex; }
  }
</style>
<link rel="stylesheet" href="/detail.css" />
</head>
<body>
  <nav>
    <div class="logo">◦ BOYCE 2026</div>
    <div class="nav-links">
      <a href="/#hero">首页</a>
      <a href="/yidian.html">APP设计</a>
      <a href="/queshan.html">web设计</a>
      <a href="/aigc.html">AIGC设计</a>
      <a href="/pingmian.html">视觉设计</a>
    </div>
  <button class="burger" onclick="document.querySelector('.nav-links').classList.toggle('open')"><span></span><span></span><span></span></button></nav>
  <div class="gallery">
    <img loading="lazy" src="/works/queshan-1.webp" alt="鹊山精煤 01" />
    <img loading="lazy" src="/works/queshan-2.webp" alt="鹊山精煤 02" />
  </div>

  <div class="side-actions">
    <button class="side-btn side-btn-qr" aria-label="微信二维码">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <path d="M14 14h3v3h-3z" />
        <path d="M18.5 18.5h2.5v2.5h-2.5z" />
      </svg>
      <div class="qr-pop">
        <img src="/images/wechat-qr.jpg" alt="微信二维码" />
        <span>扫码加我微信</span>
      </div>
    </button>
    <button class="side-btn side-btn-top" aria-label="回到顶部">↑</button>
  </div>
  <style>
    .side-actions{position:fixed;right:24px;bottom:18%;z-index:999;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s}
    .side-actions.show{opacity:1;transform:none;pointer-events:auto}
    .side-btn{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid rgba(150,168,205,.35);background:rgba(20,27,43,.8);color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .3s,border-color .3s,box-shadow .3s}
    .side-btn:hover{background:#5A73D8;border-color:#5A73D8;box-shadow:0 0 20px rgba(90,115,216,.5)}
    .side-btn-top{font-size:20px;line-height:1}
    .qr-pop{position:absolute;right:calc(100% + 14px);top:50%;transform:translateY(-50%) translateX(8px);width:150px;background:#fff;border-radius:10px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .25s,transform .25s;display:flex;flex-direction:column;align-items:center;gap:6px}
    .qr-pop img{width:128px;height:128px;object-fit:contain;border-radius:6px;display:block}
    .qr-pop span{font-size:11px;color:#333}
    .side-btn-qr:hover .qr-pop{opacity:1;visibility:visible;transform:translateY(-50%)}
    @media(max-width:760px){.side-actions{right:14px;bottom:15%;gap:10px}.side-btn{width:42px;height:42px}.side-btn-top{font-size:18px}}
  </style>
  <script>
    (function(){
      var el=document.querySelector('.side-actions');
      var topBtn=el.querySelector('.side-btn-top');
      topBtn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
      function onS(){el.classList.toggle('show',window.scrollY>window.innerHeight*0.9)}
      window.addEventListener('scroll',onS);onS();
    })();
  </script>

</body>
</html>

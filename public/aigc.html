<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIGC 设计 — 穆宏伟</title>
<style>
  @font-face {
    font-family: 'TitleFont';
    src: url('/fonts/title.ttf') format('truetype');
    font-weight: 700 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    color: #e8edff;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 48px;
    background: linear-gradient(180deg, rgba(5,7,15,0.92), rgba(5,7,15,0.6) 70%, transparent);
    backdrop-filter: blur(10px);
  }
  nav .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #fff;
  }
  nav .nav-links { display: flex; gap: 32px; }
  nav .nav-links a {
    color: #c9d4f0;
    text-decoration: none;
    font-size: 13px;
  }
  nav .nav-links a:hover { color: #fff; }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding-top: 80px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .wrap img {
    width: 100%;
    display: block;
    border-radius: 10px;
  }

  .burger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; }
  .burger span { width: 22px; height: 2px; background: currentColor; border-radius: 2px; transition: all .3s; }
  @media (max-width: 760px) {
    nav { padding: 14px 18px !important; }
    .nav-links { display: none; position: fixed; top: 56px; left: 0; right: 0; flex-direction: column; gap: 0; background: rgba(5,7,15,0.97); padding: 12px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .nav-links.open { display: flex; }
    .nav-links a { padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .burger { display: flex; }
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">◦ BOYCE 2026</div>
    <div class="nav-links">
      <a href="/#hero">首页</a>
      <a href="/yidian.html">APP设计</a>
      <a href="/tizhi.html">web设计</a>
      <a href="/aigc.html">AIGC设计</a>
      <a href="/pingmian.html">视觉设计</a>
    </div>
  <button class="burger" onclick="document.querySelector('.nav-links').classList.toggle('open')"><span></span><span></span><span></span></button></nav>
  <div class="wrap">
    <img loading="lazy" src="/works/aigc-0.webp" />
    <img loading="lazy" src="/works/aigc-1.webp" />
    <img loading="lazy" src="/works/aigc-2.webp" />
    <img loading="lazy" src="/works/aigc-3.webp" />
    <img loading="lazy" src="/works/aigc-4.webp" />
    <img loading="lazy" src="/works/aigc-5.webp" />
    <img loading="lazy" src="/works/aigc-7.webp" />
    <img loading="lazy" src="/works/aigc-6.webp" />
    <img loading="lazy" src="/works/aigc-9.webp" />
    <img loading="lazy" src="/works/aigc-8.webp" />
  </div>
</body>
</html>

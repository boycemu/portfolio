<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>跃通体质云 — 穆宏伟</title>
<style>
  @font-face {
    font-family: 'TitleFont';
    src: url('/fonts/title.ttf') format('truetype');
    font-weight: 700 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #1a1a2e;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #1a1a2e;
  }
  .nav-links {
    display: flex;
    gap: 36px;
    font-size: 14px;
    color: #666;
  }
  .nav-links a { color: inherit; text-decoration: none; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: #3b6cff; }
  .back {
    font-size: 13px;
    color: #666;
    text-decoration: none;
    border: 1px solid rgba(0,0,0,0.15);
    padding: 8px 18px;
    border-radius: 999px;
    transition: all .2s;
  }
  .back:hover { border-color: #3b6cff; color: #3b6cff; }

  .banner {
    position: relative;
    width: 100%;
    height: 70vh;
    margin-top: 80px;
    overflow: hidden;
  }
  .banner video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .banner-title {
    position: absolute;
    left: 8%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  .banner-title .cn {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .banner-title .purple {
    font-family: 'TitleFont', sans-serif;
    font-size: clamp(40px, 5vw, 80px);
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #7c5cff;
  }
  .banner-title .dark {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    font-size: clamp(20px, 2.2vw, 34px);
    font-weight: 600;
    color: #1a1a2e;
  }
  .banner-title .en {
    margin-top: 18px;
    font-family: ui-monospace, monospace;
    font-size: clamp(12px, 1.1vw, 18px);
    letter-spacing: 0.35em;
    color: #1a1a2e;
  }

  .gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 48px 100px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  .gallery img {
    width: 100%;
    border-radius: 14px;
    display: block;
    border: 1px solid rgba(0,0,0,0.06);
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">◦ BOYCE 2026</div>
    <div class="nav-links">
      <a href="/portfolio/#hero">首页</a>
      <a href="/portfolio/yidian.html">APP设计</a>
      <a href="/portfolio/tizhi.html">web设计</a>
      <a href="/portfolio/aigc.html">AIGC设计</a>
      <a href="/portfolio/pingmian.html">视觉设计</a>
    </div>
  </nav>

  <div class="banner">
    <video src="/portfolio/works/tizhi-banner.mp4" autoplay muted loop playsinline></video>
    <div class="banner-title">
      <div class="cn">
        <span class="purple">跃通体质云</span>
        <span class="dark">体质监测平台</span>
      </div>
      <div class="en">JUMPING THROUGH THE MASS CLOUD</div>
    </div>
  </div>

  <div class="gallery">
    <img loading="lazy" src="/portfolio/works/tizhi-1.webp" alt="后台界面" />
    <img loading="lazy" src="/portfolio/works/tizhi-2.webp" alt="家长端" />
  </div>
</body>
</html>

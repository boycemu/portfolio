<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>平面视觉设计 — 穆宏伟</title>
<style>
  @font-face {
    font-family: 'TitleFont';
    src: url('/fonts/title.ttf') format('truetype');
    font-weight: 700 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    color: #e8edff;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
  }
  #drape {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.7;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    background: linear-gradient(180deg, rgba(5,7,15,0.9), rgba(5,7,15,0.6) 70%, transparent);
    backdrop-filter: blur(8px);
  }
  .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #fff;
  }
  .back {
    font-size: 13px;
    color: #9fb0d8;
    text-decoration: none;
    border: 1px solid rgba(120,160,255,0.2);
    padding: 8px 18px;
    border-radius: 999px;
  }
  .section {
    padding: 110px 48px 20px;
    max-width: 1000px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .section:first-of-type { padding-top: 110px; }
  .sec {
    position: relative;
  }
  .sec-title {
    font-family: 'TitleFont', sans-serif;
    font-size: clamp(28px, 3vw, 44px);
    font-weight: 900;
    color: #fff;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }
  .row {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding-bottom: 20px;
    scrollbar-width: none;
  }
  .row::-webkit-scrollbar { display: none; }
  .row img {
    height: 320px;
    flex: 0 0 auto;
    border-radius: 10px;
    cursor: zoom-in;
    transition: transform .3s, box-shadow .3s, border-color .3s;
    border: 1px solid rgba(120,160,255,0.12);
  }
  .row img:hover {
    transform: translateY(-4px);
    border-color: rgba(59,108,255,0.6);
    box-shadow:
      0 0 0 1px rgba(59,108,255,0.35),
      0 18px 50px rgba(0,0,0,0.5),
      0 0 30px rgba(59,108,255,0.25);
  }
  .row .cover {
    height: 220px;
    cursor: pointer;
    transition: transform .3s;
  }
  .vwrap {
    position: relative;
    height: 220px;
    flex: 0 0 auto;
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
  }
  .vwrap video {
    height: 100%;
    display: block;
  }
  .vwrap .play-ico {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,7,15,0.45);
    font-size: 56px;
    color: #fff;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(120,160,255,0.3);
    background: rgba(15,22,48,0.85);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    z-index: 5;
  }
  .nav-btn.prev { left: -10px; }
  .nav-btn.next { right: -10px; }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(3,5,14,0.96);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 40px 40px;
    overflow-y: auto;
  }
  .modal.show { display: flex; }
  .modal-body {
    display: flex;
    flex-direction: column;
    gap: 24px;
    align-items: center;
  }
  .modal-body img {
    max-width: 80vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 10px;
  }
  .modal-body.brand img {
    max-width: 1200px;
    max-height: none;
  }
  .modal-close {
    position: fixed;
    top: 24px;
    right: 32px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(120,160,255,0.3);
    background: rgba(15,22,48,0.7);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    z-index: 10;
  }
  .modal-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(120,160,255,0.3);
    background: rgba(15,22,48,0.8);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
  }
  .modal-nav.prev { left: 32px; }
  .modal-nav.next { right: 32px; }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 48px;
    background: linear-gradient(180deg, rgba(5,7,15,0.92), rgba(5,7,15,0.6) 70%, transparent);
    backdrop-filter: blur(10px);
  }
  nav .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #fff;
  }
  nav .nav-links {
    display: flex;
    gap: 32px;
  }
  nav .nav-links a {
    color: #c9d4f0;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.05em;
    transition: color .2s;
  }
  nav .nav-links a:hover { color: #fff; }

  .burger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; }
  .burger span { width: 22px; height: 2px; background: currentColor; border-radius: 2px; transition: all .3s; }
  @media (max-width: 760px) {
    nav { padding: 14px 18px !important; }
    nav .nav-links { display: none; position: fixed; top: 56px; left: 0; right: 0; flex-direction: column; gap: 0; background: rgba(5,7,15,0.97); padding: 12px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    nav .nav-links.open { display: flex; }
    .nav-links a { padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .burger { display: flex; }
    .row { flex-wrap: wrap; overflow-x: visible; }
    .row .cover, .vwrap { flex: 0 0 100%; height: auto; }
    .row .cover img, .vwrap video { width: 100%; height: auto; }
  }
</style>
</head>
<body>
  <canvas id="drape"></canvas>
  <nav>
    <div class="logo">◦ BOYCE 2026</div>
    <div class="nav-links">
      <a href="/#hero">首页</a>
      <a href="/yidian.html">APP设计</a>
      <a href="/tizhi.html">web设计</a>
      <a href="/aigc.html">AIGC设计</a>

    </div>
  <button class="burger" onclick="document.querySelector('.nav-links').classList.toggle('open')"><span></span><span></span><span></span></button></nav>

  <div class="section">

      <div class="row">
        <img loading="lazy" src="/works/haibao-1.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-2.webp" onclick="openLb(this.src, this)" />

        <img loading="lazy" src="/works/haibao-9.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-10.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-11.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-12.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-13.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-14.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-15.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-16.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-17.webp" onclick="openLb(this.src, this)" />
        <img loading="lazy" src="/works/haibao-18.webp" onclick="openLb(this.src, this)" />

      <div class="row">
        <img loading="lazy" src="/works/ziti-01.webp" onclick="openLb(this.src, this)" />

    <div class="modal-body" id="modal-body"></div>
    <button class="modal-nav next" onclick="navLb(1,event)">›</button>
  </div>

<script>
  // SpectralDrape 点阵背景
  (function () {
    const canvas = document.getElementById('drape');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = innerWidth;
    let h = canvas.height = innerHeight;
    addEventListener('resize', () => { w = canvas.width = innerWidth; h = canvas.height = innerHeight; });
    let t = 0;
    (function draw() {
      ctx.clearRect(0, 0, w, h);
      const gap = 26;
      const cols = Math.ceil(w / gap) + 1;
      const rows = Math.ceil(h / gap) + 1;
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          const x = i * gap, y = j * gap;
          const z = Math.sin(i * 0.45 + t) * Math.cos(j * 0.36 + t * 1.1) * 34 + Math.sin((i + j) * 0.22 + t * 0.9) * 22;
          const depth = (z + 56) / 112;
          const size = 1.2 + depth * 2.2;
          const alpha = 0.05 + depth * 0.22;
          ctx.beginPath();
          ctx.arc(x, y + z * 0.5, size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(130,175,255,${alpha})`;
          ctx.shadowColor = '#3b6cff';
          ctx.shadowBlur = depth * 14;
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0;
      t += 0.006;
      requestAnimationFrame(draw);
    })();
  })();

  let lbList = [];
  let lbIdx = 0;
  function showBrand(n) {
    const body = document.getElementById('modal-body');
    body.classList.add('brand');
    lbList = n === 1
      ? ['/works/pingmian-brand-1.png']
      : ['/works/pingmian-brand-2.png'];
    lbIdx = 0;
    body.innerHTML = '<img loading="lazy" src="' + lbList[0] + '" />';
    document.getElementById('modal').classList.add('show');
  }
  function openLb(src, imgEl) {
    document.getElementById('modal-body').classList.remove('brand');
    lbList = Array.from(imgEl.parentElement.querySelectorAll('img')).map(i => i.src);
    lbIdx = lbList.indexOf(src);
    document.getElementById('modal-body').innerHTML = '<img loading="lazy" src="' + src + '" />';
    document.getElementById('modal').classList.add('show');
  }
  function navLb(dir, e) {
    e.stopPropagation();
    lbIdx = (lbIdx + dir + lbList.length) % lbList.length;
    document.getElementById('modal-body').innerHTML = '<img loading="lazy" src="' + lbList[lbIdx] + '" />';
  }
  function openVideo(src) {
    document.getElementById('modal-body').classList.remove('brand');
    document.getElementById('modal-body').innerHTML = '<video src="' + src + '" controls autoplay style="max-width:90vw;max-height:85vh;border-radius:10px"></video>';
    document.getElementById('modal').classList.add('show');
  }
  function closeModal(e) {
    if (e.target.classList.contains('modal') || e.target.classList.contains('modal-close')) {
      const v = document.querySelector('#modal-body video');
      if (v) v.pause();
      document.getElementById('modal').classList.remove('show');
    }
  }
  function scrollRow(btn, dir) {
    pauseUntil = Date.now() + 5000;
    btn.parentElement.querySelector('.row').scrollBy({ left: dir * 400, behavior: 'smooth' });
  }

  // 海报插画 + 字体设计自动滚动
  let pauseUntil = 0;
  window.addEventListener('load', () => {
    const rows = [document.querySelectorAll('.row')[1], document.querySelectorAll('.row')[2]];
    rows.forEach(row => {
      let dir = 1;
      setInterval(() => {
        if (Date.now() < pauseUntil) return;
        const max = row.scrollWidth - row.clientWidth;
        if (max <= 0) return;
        if (row.scrollLeft >= max - 2) dir = -1;
        if (row.scrollLeft <= 0) dir = 1;
        row.scrollBy({ left: dir * 2, behavior: 'auto' });
      }, 30);
    });
  });
</script>
</body>

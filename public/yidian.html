<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>一点臻享 · 华为体验店 — 穆宏伟</title>
<style>
  @font-face {
    font-family: 'TitleFont';
    src: url('/fonts/title.ttf') format('truetype');
    font-weight: 700 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    color: #e8edff;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    background: linear-gradient(180deg, rgba(5,7,15,0.9), rgba(5,7,15,0.6) 70%, transparent);
    backdrop-filter: blur(8px);
  }
  .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #fff;
  }
  .nav-links {
    display: flex;
    gap: 36px;
    font-size: 14px;
    color: #9fb0d8;
  }
  .nav-links a { color: inherit; text-decoration: none; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: #4d8bff; }
  .back {
    font-size: 13px;
    color: #9fb0d8;
    text-decoration: none;
    border: 1px solid rgba(120,160,255,0.2);
    padding: 8px 18px;
    border-radius: 999px;
    transition: all .2s;
  }
  .back:hover { border-color: #3b6cff; color: #fff; }

  .banner {
    position: relative;
    width: 100%;
    height: 60vh;
    margin-top: 80px;
    overflow: hidden;
  }
  .banner video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .banner-title {
    position: absolute;
    left: 8%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    font-size: clamp(20px, 2.2vw, 34px);
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 48px 100px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  .gallery img {
    width: 100%;
    border-radius: 14px;
    display: block;
    border: 1px solid rgba(120,160,255,0.12);
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">◦ BOYCE 2026</div>
    <div class="nav-links">
      <a href="/portfolio/#hero">首页</a>
      <a href="/portfolio/yidian.html">APP设计</a>
      <a href="/portfolio/tizhi.html">web设计</a>
      <a href="/portfolio/aigc.html">AIGC设计</a>
      <a href="/portfolio/pingmian.html">视觉设计</a>
    </div>
  </nav>

  <div class="banner">
    <video src="/portfolio/works/yidian-banner.mp4" autoplay muted loop playsinline></video>
    <div class="banner-title">一点臻享-华为体验店</div>
  </div>

  <div class="gallery">
    <img src="/portfolio/works/yidian-1.webp" alt="01" />
    <img src="/portfolio/works/yidian-2.webp" alt="02" />
    <img src="/portfolio/works/yidian-3.webp" alt="03" />
    <img src="/portfolio/works/yidian-4.webp" alt="04" />
    <img src="/portfolio/works/yidian-5.webp" alt="05" />
    <img src="/portfolio/works/yidian-6.webp" alt="06" />
    <img src="/portfolio/works/yidian-7.webp" alt="07" />
    <img src="/portfolio/works/yidian-8.webp" alt="08" />
    <img src="/portfolio/works/yidian-9.webp" alt="09" />
    <img src="/portfolio/works/yidian-10.webp" alt="10" />
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>品牌设计 — 穆宏伟</title>
<style>
  @font-face {
    font-family: 'TitleFont';
    src: url('/fonts/title.ttf') format('truetype');
    font-weight: 700 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    color: #e8edff;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    background: linear-gradient(180deg, rgba(5,7,15,0.9), rgba(5,7,15,0.6) 70%, transparent);
    backdrop-filter: blur(8px);
  }
  .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #fff;
  }
  .back {
    font-size: 13px;
    color: #9fb0d8;
    text-decoration: none;
    border: 1px solid rgba(120,160,255,0.2);
    padding: 8px 18px;
    border-radius: 999px;
  }
  .wrap {
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  .wrap img {
    width: 100%;
    display: block;
    cursor: zoom-in;
  }
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(3,5,14,0.96);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
  }
  .lightbox-close {
    position: fixed;
    top: 24px;
    right: 32px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(120,160,255,0.3);
    background: rgba(15,22,48,0.7);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 48px;
    background: linear-gradient(180deg, rgba(5,7,15,0.92), rgba(5,7,15,0.6) 70%, transparent);
    backdrop-filter: blur(10px);
  }
  nav .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #fff;
  }
  nav .nav-links {
    display: flex;
    gap: 32px;
  }
  nav .nav-links a {
    color: #c9d4f0;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.05em;
    transition: color .2s;
  }
  nav .nav-links a:hover { color: #fff; }
</style>
</head>
<body>
  <nav>
    <div class="logo">◦ BOYCE 2026</div>
    <div class="nav-links">
      <a href="/portfolio/#hero">首页</a>
      <a href="/portfolio/yidian.html">APP设计</a>
      <a href="/portfolio/tizhi.html">web设计</a>
      <a href="/portfolio/aigc.html">AIGC设计</a>
      <a href="/portfolio/pingmian.html">视觉设计</a>
    </div>
  </nav>

  <div class="wrap">
    <img loading="lazy" src="/portfolio/works/pingmian-brand-1.webp" />
    <img loading="lazy" src="/portfolio/works/pingmian-brand-2.webp" />
  </div>
</body>
</html>

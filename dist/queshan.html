<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹊山精煤网站 — 穆宏伟</title>
<style>
  @font-face {
    font-family: 'TitleFont';
    src: url('/fonts/title.ttf') format('truetype');
    font-weight: 700 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #1a1a2e;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #1a1a2e;
  }
  .nav-links {
    display: flex;
    gap: 36px;
    font-size: 14px;
    color: #666;
  }
  .nav-links a { color: inherit; text-decoration: none; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: #3b6cff; }
  .back {
    font-size: 13px;
    color: #666;
    text-decoration: none;
    border: 1px solid rgba(0,0,0,0.15);
    padding: 8px 18px;
    border-radius: 999px;
    transition: all .2s;
  }
  .back:hover { border-color: #3b6cff; color: #3b6cff; }

  .head {
    padding: 130px 48px 30px;
    font-size: clamp(20px, 2.2vw, 34px);
    font-weight: 600;
    color: #1a1a2e;
  }
  .gallery {
    padding: 0 0 80px;
    display: flex;
    flex-direction: column;
  }
  .gallery img {
    width: 100%;
    display: block;
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">◦ BOYCE 2026</div>
    <div class="nav-links">
      <a href="/portfolio/#hero">首页</a>
      <a href="/portfolio/yidian.html">APP设计</a>
      <a href="/portfolio/tizhi.html">web设计</a>
      <a href="/portfolio/aigc.html">AIGC设计</a>
      <a href="/portfolio/pingmian.html">视觉设计</a>
    </div>
  </nav>

  <div class="head">鹊山精煤网站</div>

  <div class="gallery">
    <img src="/portfolio/works/queshan-1.png" alt="鹊山精煤 01" />
    <img src="/portfolio/works/queshan-2.png" alt="鹊山精煤 02" />
  </div>
</body>
</html>

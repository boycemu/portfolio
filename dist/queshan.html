<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹊山精煤网站 — 穆宏伟</title>
<style>
  @font-face {
    font-family: 'TitleFont';
    src: url('/fonts/title.ttf') format('truetype');
    font-weight: 700 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #1a1a2e;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 48px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .logo {
    font-family: 'TitleFont', sans-serif;
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 15px;
    color: #1a1a2e;
  }
  .nav-links {
    display: flex;
    gap: 32px;
  }
  .nav-links a {
    color: #666;
    text-decoration: none;
    font-size: 13px;
  }
  .nav-links a:hover { color: #3b6cff; }
  .gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding-top: 80px;
    display: flex;
    flex-direction: column;
  }
  .gallery img {
    width: 100%;
    display: block;
  }

  .burger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; }
  .burger span { width: 22px; height: 2px; background: currentColor; border-radius: 2px; transition: all .3s; }
  @media (max-width: 760px) {
    nav { padding: 14px 18px !important; }
    nav .nav-links { display: none; position: fixed; top: 56px; left: 0; right: 0; flex-direction: column; gap: 0; background: rgba(5,7,15,0.97); padding: 12px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    nav .nav-links.open { display: flex; }
    .nav-links a { padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .burger { display: flex; }
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">◦ BOYCE 2026</div>
    <div class="nav-links">
      <a href="/#hero">首页</a>
      <a href="/yidian.html">APP设计</a>
      <a href="/tizhi.html">web设计</a>
      <a href="/aigc.html">AIGC设计</a>
      <a href="/pingmian.html">视觉设计</a>
    </div>
  <button class="burger" onclick="document.querySelector('.nav-links').classList.toggle('open')"><span></span><span></span><span></span></button></nav>
  <div class="gallery">
    <img loading="lazy" src="/works/queshan-1.webp" alt="鹊山精煤 01" />
    <img loading="lazy" src="/works/queshan-2.webp" alt="鹊山精煤 02" />
  </div>
</body>
</html>
